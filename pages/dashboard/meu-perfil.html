<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="imagens/logo-favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>Meu Perfil - TopTurismo</title>
</head>

<body>
    <header>
        <nav class="navbar fixed-top navbar-expand-lg custom-bg p-3">
            <div class="container-fluid d-flex align-items-center flex-wrap">
                <div class="d-flex align-items-center">
                    <img src="imagens/logo-white.png" width="50" height="50">
                    <a href="index.html" class="text-a ms-2 logo-texto">TopTurismo</a>
                </div>

                <div class="mx-auto busca-container">
                    <div class="busca-caixa">
                        <input type="text" placeholder="🔍︎ Buscar destinos...">
                    </div>
                </div>

                <div class="d-flex align-items-center ms-auto gap-3">
                    <a href="perfil.html" class="text-white fs-4 user-icon">
                        <i class="bi bi-person-circle"></i>
                    </a>

                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" type="button" id="temaMenu"
                            data-bs-toggle="dropdown">
                            <i class="bi bi-circle-half"></i> Tema
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" onclick="setTheme('light')"><i
                                        class="bi bi-sun-fill me-2"></i>Claro</a></li>
                            <li><a class="dropdown-item" onclick="setTheme('dark')"><i
                                        class="bi bi-moon-fill me-2"></i>Escuro</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="profile-header">
            <div class="container text-center">
                <div class="profile-img-container">
                    <i class="bi bi-person-circle"></i>
                    <a href="#" class="edit-photo-btn"><i class="bi bi-camera-fill" style="font-size: 16px; color: white;"></i></a>
                </div>
                <h2 class="mt-3 fw-bold secao-intro-h2">João Silva</h2>
                <p class="opacity-75">Membro desde Janeiro de 2024</p>
            </div>
        </section>

        <section class="py-5">
            <div class="container">
                <div class="row g-4">
                    <div class="col-lg-4">
                        <div class="card border-0 shadow-sm">
                            <div class="list-group list-group-flush rounded">
                                <a href="#" class="list-group-item list-group-item-action active">
                                    <i class="bi bi-person-fill me-2"></i> Meus Dados
                                </a>
                                <a href="minhas-reservas.html" class="list-group-item list-group-item-action">
                                    <i class="bi bi-geo-alt-fill me-2"></i> Minhas Viagens
                                </a>
                                <a href="pagamentos.html" class="list-group-item list-group-item-action">
                                    <i class="bi bi-credit-card-fill me-2"></i> Pagamentos
                                </a>
                                <a href="index.html" class="list-group-item list-group-item-action text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i> Sair
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-8">
                        <div class="card border-0 shadow-sm p-4 mb-4">
                            <h4 class="fw-bold mb-4" style="color: var(--btn-bg);">Informações Pessoais</h4>
                            <form class="row g-3 m-0 p-0 bg-transparent">
                                <div class="col-md-6">
                                    <label class="form-label">Nome Completo</label>
                                    <input type="text" class="form-control" value="João Silva">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">E-mail</label>
                                    <input type="email" class="form-control" value="joao.silva@email.com">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Telefone</label>
                                    <input type="text" class="form-control" value="(11) 98888-7777">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Cidade</label>
                                    <input type="text" class="form-control" value="Brasília">
                                </div>
                                <div class="col-12 mt-4 text-end">
                                    <button type="submit" class="btn btn-custom px-5">Salvar Alterações</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
