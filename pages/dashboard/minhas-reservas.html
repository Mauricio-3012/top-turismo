<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Minhas Viagens - TopTurismo</title>
</head>
<body>
    <header>
        <nav class="navbar fixed-top navbar-expand-lg custom-bg p-3">
            <div class="container-fluid d-flex align-items-center flex-wrap">
                <div class="d-flex align-items-center">
                    <img src="imagens/logo-white.png" width="50" height="50">
                    <a href="index.html" class="text-a ms-2 logo-texto">TopTurismo</a>
                </div>
                <div class="mx-auto busca-container">
                    <div class="busca-caixa"><input type="text" placeholder="🔍︎ Buscar destinos..."></div>
                </div>
                <div class="d-flex align-items-center ms-auto gap-3">
                    <a href="perfil.html" class="text-white fs-4"><i class="bi bi-person-circle"></i></a>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-circle-half"></i> Tema
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" onclick="setTheme('light')">Claro</a></li>
                            <li><a class="dropdown-item" onclick="setTheme('dark')">Escuro</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="mt-5 pt-5">
        <div class="container py-5">
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm">
                        <div class="list-group list-group-flush rounded">
                            <a href="perfil.html" class="list-group-item list-group-item-action">
                                <i class="bi bi-person-fill me-2"></i> Meus Dados
                            </a>
                            <a href="minhas-viagens.html" class="list-group-item list-group-item-action active" style="background-color: var(--btn-bg) !important; border:none;">
                                <i class="bi bi-geo-alt-fill me-2"></i> Minhas Viagens
                            </a>
                            <a href="pagamentos.html" class="list-group-item list-group-item-action">
                                <i class="bi bi-credit-card-fill me-2"></i> Pagamentos
                            </a>
                            <a href="index.html" class="list-group-item list-group-item-action text-danger">
                                <i class="bi bi-box-arrow-right me-2"></i> Sair
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm p-4">
                        <h4 class="fw-bold mb-4" style="color: var(--btn-bg);">Minhas Viagens</h4>
                        
                        <div class="p-3 border rounded mb-3 position-relative" style="border-left: 5px solid var(--btn-bg) !important;">
                            <span class="badge bg-warning text-dark position-absolute top-0 end-0 m-3">Próxima</span>
                            <h5 class="fw-bold">Rio de Janeiro, RJ</h5>
                            <p class="text-muted small mb-2"><i class="bi bi-calendar3 me-2"></i>15/12/2025 - 22/12/2025</p>
                            <p class="mb-0"><strong>Status:</strong> Confirmado</p>
                        </div>

                        <div class="p-3 border rounded mb-3 opacity-75" style="border-left: 5px solid #6c757d !important;">
                            <h5 class="fw-bold text-muted">Florianópolis, SC</h5>
                            <p class="text-muted small mb-2"><i class="bi bi-calendar-check me-2"></i>10/01/2024 - 17/01/2024</p>
                            <p class="mb-0"><strong>Status:</strong> Finalizada</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
